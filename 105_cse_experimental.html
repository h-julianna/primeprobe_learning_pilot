function createPracticeStimuli(stimulus, red_stimulus) {
  const n_total = 16;
  const n_red = 4;
  const n_black = 12;

  const n_red_congruent = 2;
  const n_red_incongruent = 2;
  const n_black_congruent = 6;
  const n_black_incongruent = 6;

  // Split by congruency
  const blackCongruent = stimulus.filter(s => s.congruency === "congruent");
  const blackIncongruent = stimulus.filter(s => s.congruency === "incongruent");
  const redCongruent = red_stimulus.filter(s => s.congruency === "congruent");
  const redIncongruent = red_stimulus.filter(s => s.congruency === "incongruent");

  // sample (with replacement if needed)
  const selected = [
    ...jsPsych.randomization.sampleWithReplacement(blackCongruent, n_black_congruent),
    ...jsPsych.randomization.sampleWithReplacement(blackIncongruent, n_black_incongruent),
    ...jsPsych.randomization.sampleWithReplacement(redCongruent, n_red_congruent),
    ...jsPsych.randomization.sampleWithReplacement(redIncongruent, n_red_incongruent),
  ];

  let allTrials = jsPsych.randomization.shuffle(selected);

  function getSignature(trial) {
    return `${trial.correct_response}_${trial.congruency}_${trial.name}`;
  }

  let ordered = [allTrials[0]];

for (let i = 1; i < allTrials.length; i++) {
  let current = allTrials[i];
  let prev = ordered[ordered.length - 1];

  function getAxis(trial) {
    return ["a", "d"].includes(trial.correct_response) ? "horizontal" : "vertical";
  }

  let attempts = 0;
  while (
  (
    getSignature(current) === getSignature(prev) ||                 
    (current.name === "red_stimulus" && prev.name === "red_stimulus") || 
    (getAxis(current) === getAxis(prev)) ||
    (
      (current.correct_response === "a" && prev.correct_response === "a") ||
      (current.correct_response === "d" && prev.correct_response === "d") ||
      (current.correct_response === "i" && prev.correct_response === "i") ||
      (current.correct_response === "n" && prev.correct_response === "n")
    )
  ) &&
  attempts < allTrials.length
){
    // find a safe trial to swap in
    let swapIndex = allTrials.findIndex(
      (t, idx) =>
        idx > i &&
        getSignature(t) !== getSignature(prev) &&
        !(t.name === "red_stimulus" && prev.name === "red_stimulus") &&
        getAxis(t) !== getAxis(prev)                                  // only swap with opposite axis
    );

    if (swapIndex === -1) break;
    [allTrials[i], allTrials[swapIndex]] = [allTrials[swapIndex], allTrials[i]];
    current = allTrials[i];
    attempts++;
  }

  ordered.push(current);
}

  return ordered.slice(0, n_total);
}
const practicestimuli = createPracticeStimuli(stimulus, red_stimulus);
const practice_block = {
    timeline: [fixation, prime_trial, blank, probe_trial],

    }
};
const all_practice = {

//experimental blocks
const experimental_blocks = randomized_stimuli_per_participant.map((block_stimuli, i) => {
  return {
    timeline: [
      {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="text-align:center; font-size:24px;">
            <h2>Blokk ${i + 1} kezdődik</h2>
          </div>`,
        choices: "NO_KEYS",
        trial_duration: 2000
      },
      {
        timeline: [fixation, prime_trial, blank, probe_trial],
        timeline_variables: block_stimuli,
        randomize_order: false
      }
    ],

    on_timeline_start: () => {
      console.log(`Starting Block ${i + 1}`);
    },

    on_timeline_finish: function() {
      const block_data = jsPsych.data.get().last(block_stimuli.length).values();

      for (let t = 1; t < block_data.length; t++) {
        const prev = block_data[t - 1];
        const curr = block_data[t];

        //extracting name and color
        const prevName = prev.name || "";
        const currName = curr.name || "";
        const prevColor = prev.color || "";
        const currColor = curr.color || "";

        // consecutive red trials check
        if (prevColor === "red" && currColor === "red") {
          console.error(
            `Two consecutive red trials detected in block ${i + 1} (trials ${t} & ${t + 1}): ${prevName} -> ${currName}`
          );
          jsPsych.endExperiment("Experiment stopped: consecutive red trials detected.");
          return;
        }

        //directional orientation alternation check
        const prevIsVertical = prevName.includes("vertical");
        const currIsVertical = currName.includes("vertical");
        const prevIsHorizontal = prevName.includes("horizontal");
        const currIsHorizontal = currName.includes("horizontal");

        if ((prevIsVertical && currIsVertical) || (prevIsHorizontal && currIsHorizontal)) {
          console.error(
            `Orientation alternation broken in block ${i + 1} (trials ${t} & ${t + 1}): ${prevName} -> ${currName}`
          );
          jsPsych.endExperiment("Experiment stopped: two consecutive trials share the same orientation.");
          return;
        }
      }

      console.log(`Block ${i + 1} passed red–red and H–V alternation checks.`);
    }
  };
});

      </div>`;
  },
  choices: "ALL_KEYS",
  trial_duration: 120000,

      timerDisplay.textContent = `Kezdés: ${minutes}:${seconds.toString().padStart(2, '0')}`;
      if (timeLeft <= 0) clearInterval(countdown);
    }, 1000);
  },
  data: { task: 'intermission' }
};
